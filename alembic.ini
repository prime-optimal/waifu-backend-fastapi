[alembic]
# path to migration scripts
script_location = alembic
# the sqlachemy.url is intentionally left blank; env.py will read
# ALEMBIC_DATABASE_URL or DATABASE_URL from environment to avoid committing secrets.
sqlalchemy.url = driver://user:pass@localhost/dbname

# file template used to generate new revision files
file_template = %%(rev)s_%%(slug)s

# Logging configuration
# See: https://docs.sqlalchemy.org/en/14/core/engines.html#database-urls
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S