[project]
name = "waifu-backend-fastapi"
version = "0.3.0"
description = "FastAPI-based backend of the Waifu Material project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.100.0",
    "httptools>=0.7.1",
    "hypercorn==0.14.4",
    "uvloop>=0.22.1",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "aiosqlite>=0.19.0",
    "pydantic-settings>=2.5.2",
    "python-multipart>=0.0.9",
    "psycopg2>=2.9.11",
    "logfire>=4.14.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.1",
    "pytest-asyncio>=0.23.8",
]

[tool.pytest.ini_options]
markers = [
    "asyncio: mark async tests",
]
asyncio_mode = "auto"
